<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise Routines</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f6f4">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --border: #e8e8e5;
  --text: #1c1c1a;
  --text-muted: #8f8f8a;

  --A: #AEE8B6;    /* lighter green */
  --B: #BBDCFB;    /* lighter blue */
  --A-dark: #47744e;
  --B-dark: #486b8c;
  --D: #F0E9D2;    /* pale sand: daily-only session, deliberately quiet */
  --done: #E3E3E0; /* light grey */
  --empty: rgba(0,0,0,0.08);
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  max-width: 480px;
  margin: 0 auto;
  padding: 32px 20px 48px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

h1 {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 20px;
}

.import-link {
  font-size: 14px;
  color: var(--text-muted);
  text-decoration: underline;
  cursor: pointer;
}

.import-link:hover {
  color: var(--text);
}

/* buttons that should look like the text links */
button.import-link {
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
}

.import-link.block {
  display: block;
  margin: 14px 0;
}

.import-icon {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
}

.import-icon:hover {
  color: var(--text);
}

.import-icon svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
}

/* page header: title and Add CSV share a baseline */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 24px;
}

.page-header h1 {
  margin: 0;
  font-weight: 500;
}

/* home sections: content plus its own link, clear space between sections */
.section {
  margin-bottom: 40px;
}

.section-link {
  text-align: right;
  margin-top: 12px;
}

.section-link .import-link {
  text-decoration: none;
}

.section-link .import-link::after {
  content: "\2192";
  display: inline-block;
  margin-left: 6px;
}

.hero-card {
  border-radius: 12px;
  padding: 20px 18px;
}

.hero-title {
  font-size: clamp(26px, 8vw, 34px);
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.02em;
  text-wrap: balance;
  margin-bottom: 8px;
}

.hero-eyebrow {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 7px;
}

.hero-title.active {
  margin-bottom: 16px;
}

.hero-title.completed {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 20px;
}

.hero-check {
  font-size: 0.8em;
  line-height: 1;
}

.hero-sub {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.hero-btn {
  background: var(--text);
  color: var(--surface);
  border-radius: 6px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  width: 100%;
  border: none;
  cursor: pointer;
}

.hero-btn:active {
  opacity: 0.8;
}

.hero-btn.outline {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--text-muted);
}

#markDoneBtn {
  margin-top: 16px;
}

.card {
  padding: 16px 18px;
  margin-bottom: 10px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--border);
  font-size: 15.5px;
  line-height: 1.6;
}

.card-detail {
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 6px;
}

#backBtn,
#backBtnRoutines,
#backBtnHistory {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 0 0 18px 0;
  cursor: pointer;
}

#backBtn:hover,
#backBtnRoutines:hover,
#backBtnHistory:hover {
  color: var(--text);
}

/* 7 equal columns across the full content width */
.calendarRow {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.calendarHead {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
}

/* each cell is a touch taller than wide: rows end up further apart than columns */
.calendarCell {
  aspect-ratio: 1 / 1.1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.calendarCircle {
  width: 70%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: var(--empty);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.calendarCircle.A { background: var(--A); }
.calendarCircle.B { background: var(--B); }
.calendarCircle.D { background: var(--D); color: var(--text-muted); }
.calendarCircle.today { box-shadow: 0 0 0 2px var(--text); }

#monthlyCalendar + .section-link {
  margin-top: 0;
}

#monthlyCalendar h3 {
  font-weight: 500;
}

/* routine pages take the colour of their routine */
body.theme-A { background: var(--A); }
body.theme-B { background: var(--B); }
body.theme-D { background: var(--D); }
body[class*="theme-"] { --text-muted: #5b5b56; }

.page {
  display: none;
}

#emptyState {
  margin: 0 0 24px;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.5;
}

.sync-panel {
  margin: -10px 0 24px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.sync-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sync-input {
  flex: 1;
  min-width: 0;
  padding: 8px 9px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font: inherit;
  font-size: 13px;
}

.sync-button {
  width: auto;
  padding: 0;
  border: 0;
  color: var(--text-muted);
  font-size: 13px;
  white-space: nowrap;
}

.sync-status {
  margin-top: 7px;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.4;
}

.history-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: -4px 0 28px;
}

.history-stat {
  padding: 12px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  text-align: center;
}

.history-stat-value {
  display: block;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
}

.history-stat-label {
  display: block;
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 11px;
}

.history-empty {
  padding: 18px 0 24px;
  color: var(--text-muted);
  font-size: 14px;
}

.history-day {
  margin-bottom: 28px;
}

.history-day-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 9px;
}

.history-day-date {
  font-size: 15px;
  font-weight: 600;
}

.history-day-count {
  color: var(--text-muted);
  font-size: 12px;
}

.history-entry {
  margin-bottom: 8px;
  padding: 13px 14px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.history-entry:last-child {
  margin-bottom: 0;
}

.history-entry-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.history-badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 600;
}

.history-badge.A { background: var(--A); color: var(--A-dark); }
.history-badge.B { background: var(--B); color: var(--B-dark); }
.history-badge.D { background: var(--D); color: var(--text-muted); }

.history-entry-meta {
  color: var(--text-muted);
  font-size: 11px;
}

.history-exercises {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 7px;
  margin: 11px 0 0;
  padding: 0;
  list-style: none;
}

.history-exercises li {
  padding: 4px 7px;
  border-radius: 4px;
  background: var(--bg);
  font-size: 12px;
  line-height: 1.25;
}

@media (max-width: 360px) {
  .history-summary {
    gap: 5px;
  }

  .history-stat {
    padding-left: 6px;
    padding-right: 6px;
  }
}
</style>
</head>

<body>

<!-- HOME VIEW -->
<div id="homeView">
  <div class="page-header">
    <h1>Exercise Routines</h1>
    <label for="csvInput" class="import-icon" aria-label="Import CSV" title="Import CSV">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <path d="m17 8-5-5-5 5"></path>
        <path d="M12 3v12"></path>
      </svg>
    </label>
    <input type="file" id="csvInput" accept=".csv" style="display:none">
  </div>

  <div class="sync-panel">
    <div class="sync-row" id="signedOutSync">
      <input id="authEmail" class="sync-input" type="email" placeholder="Email for sync" autocomplete="email">
      <button id="signInBtn" class="import-link sync-button" type="button">Sign in</button>
    </div>
    <div class="sync-row" id="signedInSync" style="display:none;">
      <span id="signedInEmail" class="sync-status" style="margin:0; flex:1;"></span>
      <button id="syncNowBtn" class="import-link sync-button" type="button">Sync</button>
      <button id="signOutBtn" class="import-link sync-button" type="button">Sign out</button>
    </div>
    <div id="syncStatus" class="sync-status">Local-only mode</div>
  </div>

  <div id="emptyState" style="display:none;">
    No data yet — import a CSV to get started.
  </div>

  <div class="section">
    <div id="heroContainer"></div>
    <div class="section-link">
      <button class="import-link" onclick="openRoutinesPage()">View all routines</button>
    </div>
  </div>

  <div class="section">
    <div id="monthlyCalendar"></div>
    <div class="section-link">
      <button class="import-link" onclick="openHistoryPage()">History</button>
    </div>
  </div>
</div>

<!-- ROUTINE VIEW -->
<div id="routineView" class="page">
  <button id="backBtn">&larr; Back</button>
  <h1 id="routineTitle"></h1>
  <div id="cardList"></div>
  <button id="markDoneBtn" class="hero-btn">Mark Routine as Done</button>
</div>

<!-- ALL ROUTINES PAGE -->
<div id="routinesPage" class="page">
  <button id="backBtnRoutines">&larr; Back</button>
  <h1>All Routines</h1>
  <button class="import-link block" onclick="startSpecificRoutine('daily', 'routinesPage')">Daily</button>
  <button class="import-link block" onclick="startSpecificRoutine('A', 'routinesPage')">Routine A</button>
  <button class="import-link block" onclick="startSpecificRoutine('B', 'routinesPage')">Routine B</button>
</div>

<!-- HISTORY PAGE -->
<div id="historyPage" class="page">
  <button id="backBtnHistory">&larr; Back</button>
  <h1>History</h1>
  <div id="history"></div>
  <button id="downloadHistoryBtn" class="import-link" style="margin-top:10px;">Download History</button>
</div>

<script>
// Paste these values from Supabase Dashboard -> Project Settings -> API.
const SUPABASE_URL = "https://xykbjfcjtnrlqfeedxeq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WqTnXyuzY10HUWakrzQ9pw_lCTg-ffu";
const supabaseConfigured = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
const supabaseClient = supabaseConfigured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let currentUser = null;

// --- HELPERS ---
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function getLocalDateString(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function getExercises() {
  return JSON.parse(localStorage.getItem("exercises") || "[]");
}

function getHistory() {
  return JSON.parse(localStorage.getItem("history") || "[]");
}

function normaliseExercises(exercises) {
  const seen = new Set();
  return exercises.filter(exercise => {
    const key = JSON.stringify([
      exercise.exercise,
      exercise.routine,
      exercise.details || ""
    ]);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function setSyncStatus(message) {
  document.getElementById("syncStatus").textContent = message;
}

function setSignedIn(user) {
  currentUser = user;
  document.getElementById("signedOutSync").style.display = user ? "none" : "flex";
  document.getElementById("signedInSync").style.display = user ? "flex" : "none";
  document.getElementById("signedInEmail").textContent = user ? user.email : "";
  if (user) setSyncStatus("Signed in");
}

function ensureHistoryIds(history) {
  let changed = false;
  const withIds = history.map(entry => {
    if (entry.id) return entry;
    changed = true;
    return { ...entry, id: crypto.randomUUID() };
  });
  if (changed) localStorage.setItem("history", JSON.stringify(withIds));
  return withIds;
}

async function syncFromSupabase() {
  if (!supabaseClient) return;
  setSyncStatus("Syncing...");

  const [{ data: cloudExercises, error: exercisesError }, { data: cloudSessions, error: sessionsError }] = await Promise.all([
    supabaseClient.from("exercises").select("position, exercise, routine, details, version, csv_hash").order("position"),
    supabaseClient.from("sessions").select("id, date, routine, version, exercises, created_at").order("created_at")
  ]);
  if (exercisesError) throw exercisesError;
  if (sessionsError) throw sessionsError;

  const localExercises = normaliseExercises(getExercises());
  if (cloudExercises.length > 0) {
    const cleanedExercises = normaliseExercises(cloudExercises.map(row => ({
      exercise: row.exercise,
      routine: row.routine,
      details: row.details || ""
    })));
    localStorage.setItem("exercises", JSON.stringify(cleanedExercises));
    if (cleanedExercises.length !== cloudExercises.length) {
      await uploadExercises(cleanedExercises);
    }
  } else if (localExercises.length > 0) {
    await uploadExercises(localExercises);
  }

  const localHistory = ensureHistoryIds(getHistory());
  if (cloudSessions.length > 0) {
    localStorage.setItem("history", JSON.stringify(cloudSessions.map(row => ({
      id: row.id,
      date: row.date,
      routine: row.routine,
      version: row.version,
      exercises: row.exercises || []
    }))));
  } else if (localHistory.length > 0) {
    await uploadHistory(localHistory);
  }

  renderHome();
  setSyncStatus("Synced");
}

async function uploadExercises(exercises) {
  exercises = normaliseExercises(exercises);
  localStorage.setItem("exercises", JSON.stringify(exercises));
  const version = parseInt(localStorage.getItem("routineVersion") || "1", 10);
  const hash = localStorage.getItem("csvHash");
  const { error } = await supabaseClient.rpc("replace_exercises", {
    p_rows: exercises,
    p_imported_at: new Date().toISOString(),
    p_version: version,
    p_hash: hash
  });
  if (error) throw error;
}

async function uploadHistory(history) {
  const rows = history.map(entry => ({
    id: entry.id,
    date: entry.date,
    routine: routineSymbol(entry.routine),
    version: entry.version ? Number(entry.version) : null,
    exercises: entry.exercises || []
  }));
  const { error } = await supabaseClient.from("sessions").upsert(rows, { onConflict: "id" });
  if (error) throw error;
}

async function pushLocalData() {
  if (!supabaseClient || !currentUser) return;
  setSyncStatus("Saving...");
  const exercises = normaliseExercises(getExercises());
  const history = ensureHistoryIds(getHistory());

  if (exercises.length > 0) await uploadExercises(exercises);
  if (history.length > 0) await uploadHistory(history);
  setSyncStatus("Synced");
}

async function syncNow(deletedSessionIds = []) {
  try {
    if (deletedSessionIds.length > 0) {
      const { error } = await supabaseClient
        .from("sessions")
        .delete()
        .in("id", deletedSessionIds);
      if (error) throw error;
    }
    await pushLocalData();
    await syncFromSupabase();
  } catch (error) {
    console.error("Supabase sync failed:", error);
    setSyncStatus("Sync failed: " + (error.message || "check your Supabase setup"));
  }
}

async function initSupabase() {
  if (!supabaseConfigured) {
    setSyncStatus("Local-only mode: add Supabase credentials in index.html");
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  setSignedIn(session?.user || null);
  if (!session?.user) setSyncStatus("Ready to sign in and sync");
  if (session?.user) await syncNow();

  supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
    setSignedIn(nextSession?.user || null);
    if (nextSession?.user) setTimeout(syncNow, 0);
  });
}

// "daily" is the routine name in the CSV; "D" is how it appears in history/calendar.
// Also maps any older history entries that were saved as "daily".
function routineSymbol(r) {
  return r === "daily" ? "D" : r;
}

// --- CSV PARSER (handles quoted fields, commas inside quotes, CRLF, BOM) ---
function parseCSVRows(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field);
      field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field);
      field = "";
      rows.push(row);
      row = [];
    } else {
      field += c;
    }
  }
  row.push(field);
  rows.push(row);
  return rows;
}

function normaliseRoutine(r) {
  const t = r.trim();
  return t.toLowerCase() === "daily" ? "daily" : t.toUpperCase();
}

function parseCSV(text) {
  const clean = text.replace(/^\uFEFF/, "");
  return parseCSVRows(clean)
    .slice(1) // header
    .filter(cols => cols.length >= 2 && cols[0].trim() !== "")
    .map(cols => ({
      exercise: cols[0].trim(),
      routine: normaliseRoutine(cols[1]),
      // any unquoted commas in the details column get stitched back together
      details: cols.slice(2).join(",").trim()
    }));
}

// --- HASH FOR VERSIONING (covers the whole file, no btoa) ---
function hashCSV(text) {
  let h = 0;
  for (let i = 0; i < text.length; i++) {
    h = (h * 31 + text.charCodeAt(i)) | 0;
  }
  return String(h);
}

function updateVersionIfChanged(csvText) {
  const newHash = hashCSV(csvText);
  const oldHash = localStorage.getItem("csvHash");

  if (newHash !== oldHash) {
    let version = parseInt(localStorage.getItem("routineVersion") || "0", 10);
    version += 1;
    localStorage.setItem("routineVersion", version);
    localStorage.setItem("csvHash", newHash);
  }
}

// --- LOAD CSV ---
document.getElementById("csvInput").addEventListener("change", function(e) {
  const input = e.target;
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    const csvText = event.target.result;
    const exercises = parseCSV(csvText);

    if (exercises.length === 0) {
      alert("No exercises found in that CSV. Expected columns: exercise, routine, details.");
    } else {
      updateVersionIfChanged(csvText);
      localStorage.setItem("exercises", JSON.stringify(exercises));
      renderHome();
      if (currentUser) syncNow();
    }

    input.value = ""; // lets you re-import the same file
  };
  reader.readAsText(file);
});

// --- DETERMINE NEXT ROUTINE ---
function getNextRoutine() {
  const last = localStorage.getItem("lastRoutine");
  return last === "A" ? "B" : "A";
}

// --- CHECK IF DONE TODAY (a daily-only session doesn't count) ---
function hasDoneToday() {
  const today = getLocalDateString();
  return getHistory().some(h => h.date === today && routineSymbol(h.routine) !== "D");
}

function getTodayRoutineIndex() {
  const today = getLocalDateString();
  return getHistory().findLastIndex(
    h => h.date === today && routineSymbol(h.routine) !== "D"
  );
}

// --- HERO CARD ---
function renderHero() {
  const hero = document.getElementById("heroContainer");
  const exercises = getExercises();

  if (exercises.length === 0) {
    hero.innerHTML = "";
    return;
  }

  if (hasDoneToday()) {
    hero.innerHTML = `
      <div class="hero-card" style="background: var(--done);">
        <div class="hero-title completed">Done for today <span class="hero-check" aria-hidden="true">✓</span></div>
        <button class="hero-btn outline" onclick="reopenTodayRoutine()">View Today’s Routine</button>
      </div>
    `;
  } else {
    const routine = getNextRoutine();
    const bg = routine === "A" ? "var(--A)" : "var(--B)";
    hero.innerHTML = `
      <div class="hero-card" style="background:${bg};">
        <div class="hero-eyebrow" style="color: var(--${routine}-dark);">Today</div>
        <div class="hero-title active">Routine ${routine}</div>
        <button class="hero-btn" onclick="startRoutine()">Start Routine</button>
      </div>
    `;
  }
}

// --- CALENDAR ---
function renderMonthlyCalendar() {
  const history = getHistory();
  const container = document.getElementById("monthlyCalendar");

  const today = new Date();
  const todayStr = getLocalDateString(today);
  const startDate = new Date(today);
  const daysSinceMonday = (today.getDay() + 6) % 7;
  startDate.setDate(today.getDate() - daysSinceMonday - 21);

  const weekdays = ["M", "T", "W", "T", "F", "S", "S"];
  let rows = `<div class="calendarRow">${
    weekdays.map(d => `<div class="calendarHead">${d}</div>`).join("")
  }</div>`;

  for (let week = 0; week < 4; week++) {
    let row = "<div class='calendarRow'>";

    for (let i = 0; i < 7; i++) {
      const date = new Date(startDate);
      date.setDate(startDate.getDate() + week * 7 + i);
      const dateStr = getLocalDateString(date);

      // if a day has both, show the full routine rather than the daily-only session
      const dayEntries = history.filter(h => h.date === dateStr);
      const entry = dayEntries.find(h => routineSymbol(h.routine) !== "D") || dayEntries[0];
      const symbol = entry ? routineSymbol(entry.routine) : "";
      const cls = [symbol, dateStr === todayStr ? "today" : ""].filter(Boolean).join(" ");

      row += `<div class="calendarCell"><div class="calendarCircle ${esc(cls)}" title="${dateStr}">${esc(symbol)}</div></div>`;
    }

    row += "</div>";
    rows += row;
  }

  container.innerHTML = `
    <h3 style="margin:0 0 10px;">
      Last 4 weeks
    </h3>
    ${rows}
  `;
}

// --- HOME PAGE ---
function renderHome() {
  document.getElementById("emptyState").style.display =
    getExercises().length === 0 ? "block" : "none";

  renderHero();
  renderMonthlyCalendar();

  showPage("homeView");
}

// --- PAGE NAVIGATION ---
function showPage(id) {
  document.getElementById("homeView").style.display = "none";
  document.getElementById("routineView").style.display = "none";
  document.getElementById("routinesPage").style.display = "none";
  document.getElementById("historyPage").style.display = "none";

  document.getElementById(id).style.display = "block";
  document.body.className = id === "routineView" ? "theme-" + routineSymbol(activeRoutine) : "";
}

function openRoutinesPage() {
  showPage("routinesPage");
}

function openHistoryPage() {
  renderHistory();
  showPage("historyPage");
}

// --- ROUTINE PAGE ---
let activeRoutine = null;
let activeExercises = [];
let activeCompletionIndex = -1;
let routineBackTarget = "homeView";

function startRoutine() {
  startSpecificRoutine(getNextRoutine(), "homeView");
}

function reopenTodayRoutine() {
  const history = getHistory();
  const completionIndex = getTodayRoutineIndex();
  if (completionIndex === -1) return;

  startSpecificRoutine(routineSymbol(history[completionIndex].routine), "homeView", completionIndex);
}

function startSpecificRoutine(routine, backTarget = "homeView", completionIndex = -1) {
  activeRoutine = routine;
  activeCompletionIndex = completionIndex;
  routineBackTarget = backTarget;
  const exercises = getExercises();
  const daily = exercises.filter(e => e.routine === "daily");

  // Daily exercises are part of both A and B; "daily" on its own is the short version
  activeExercises = routine === "daily"
    ? daily
    : [...daily, ...exercises.filter(e => e.routine === routine)];

  document.getElementById("routineTitle").innerText =
    routine === "daily" ? "Daily Exercises" : `Routine ${routine}`;

  document.getElementById("cardList").innerHTML = activeExercises.map(e => `
    <div class="card">
      <strong>${esc(e.exercise)}</strong>
      <div class="card-detail">${esc(e.details)}</div>
    </div>
  `).join("");

  document.getElementById("markDoneBtn").innerText =
    activeCompletionIndex === -1 ? "Mark Routine as Done" : "Mark Routine as Undone";

  showPage("routineView");
}

// --- MARK ROUTINE AS DONE ---
document.getElementById("markDoneBtn").addEventListener("click", function() {
  if (!activeRoutine) return;

  if (activeCompletionIndex !== -1) {
    const history = ensureHistoryIds(getHistory());
    const removedEntry = history.splice(activeCompletionIndex, 1)[0];
    localStorage.setItem("history", JSON.stringify(history));

    const previousRoutine = history.findLast(entry => {
      const symbol = routineSymbol(entry.routine);
      return symbol === "A" || symbol === "B";
    });

    if (previousRoutine) {
      localStorage.setItem("lastRoutine", routineSymbol(previousRoutine.routine));
    } else {
      localStorage.removeItem("lastRoutine");
    }

    activeCompletionIndex = -1;
    renderHome();
    if (currentUser) syncNow(removedEntry?.id ? [removedEntry.id] : []);
    return;
  }

  const version = localStorage.getItem("routineVersion") || 1;
  const symbol = routineSymbol(activeRoutine);

  // only A/B move the rotation; a daily-only session leaves "next" unchanged
  if (symbol === "A" || symbol === "B") {
    localStorage.setItem("lastRoutine", symbol);
  }

  const history = getHistory();
  history.push({
    date: getLocalDateString(),
    routine: symbol,
    version: version,
    exercises: activeExercises.map(e => e.exercise)
  });

  localStorage.setItem("history", JSON.stringify(history));

  renderHome();
  if (currentUser) syncNow();
});

// --- BACK BUTTONS ---
document.getElementById("backBtn").addEventListener("click", function() {
  if (routineBackTarget === "routinesPage") {
    showPage("routinesPage");
  } else {
    renderHome();
  }
});
document.getElementById("backBtnRoutines").addEventListener("click", renderHome);
document.getElementById("backBtnHistory").addEventListener("click", renderHome);

// --- HISTORY PAGE ---
function renderHistory() {
  const container = document.getElementById("history");
  const history = getHistory();

  if (history.length === 0) {
    container.innerHTML = `<div class="history-empty">No completed routines yet.</div>`;
    return;
  }

  const dates = [...new Set(history.map(entry => entry.date))].sort().reverse();
  const formatDate = dateString => {
    const date = new Date(`${dateString}T00:00:00`);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const todayString = getLocalDateString(today);
    const yesterdayString = getLocalDateString(yesterday);
    const formatted = date.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

    if (dateString === todayString) return `Today, ${formatted.split(", ").slice(1).join(", ")}`;
    if (dateString === yesterdayString) return `Yesterday, ${formatted.split(", ").slice(1).join(", ")}`;
    return formatted;
  };

  const sessionCount = history.length;
  const routineDays = new Set(history.filter(entry => routineSymbol(entry.routine) !== "D").map(entry => entry.date)).size;
  const lastDate = dates[0];
  const groupedHistory = dates.map(date => {
    const entries = history.filter(entry => entry.date === date).reverse();
    const entryMarkup = entries.map(entry => {
      const symbol = routineSymbol(entry.routine);
      const label = symbol === "D" ? "Daily exercises" : `Routine ${symbol}`;
      const exercises = Array.isArray(entry.exercises) ? entry.exercises : [];
      const exerciseMarkup = exercises.length
        ? exercises.map(exercise => `<li>${esc(exercise)}</li>`).join("")
        : `<li>No exercise list recorded</li>`;

      return `
        <article class="history-entry">
          <div class="history-entry-top">
            <span class="history-badge ${esc(symbol)}">${esc(label)}</span>
            <span class="history-entry-meta">${exercises.length} exercise${exercises.length === 1 ? "" : "s"}</span>
          </div>
          <ul class="history-exercises">${exerciseMarkup}</ul>
        </article>
      `;
    }).join("");

    return `
      <section class="history-day">
        <div class="history-day-header">
          <div class="history-day-date">${esc(formatDate(date))}</div>
          <div class="history-day-count">${entries.length} session${entries.length === 1 ? "" : "s"}</div>
        </div>
        ${entryMarkup}
      </section>
    `;
  }).join("");

  container.innerHTML = `
    <div class="history-summary" aria-label="History summary">
      <div class="history-stat"><span class="history-stat-value">${sessionCount}</span><span class="history-stat-label">sessions</span></div>
      <div class="history-stat"><span class="history-stat-value">${routineDays}</span><span class="history-stat-label">routine days</span></div>
      <div class="history-stat"><span class="history-stat-value">${esc(lastDate.slice(5).replace("-", "/"))}</span><span class="history-stat-label">most recent</span></div>
    </div>
    ${groupedHistory}
  `;
}

document.getElementById("downloadHistoryBtn").addEventListener("click", function() {
  const csvRows = ["date,routine,version,exercises"];

  getHistory().forEach(entry => {
    const exercises = entry.exercises.join("|").replace(/"/g, '""');
    csvRows.push(`${entry.date},${routineSymbol(entry.routine)},${entry.version},"${exercises}"`);
  });

  const blob = new Blob([csvRows.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "routine_history.csv";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

document.getElementById("signInBtn").addEventListener("click", async function() {
  if (!supabaseClient) {
    setSyncStatus("Add Supabase credentials in index.html first");
    return;
  }

  const email = document.getElementById("authEmail").value.trim();
  if (!email) {
    setSyncStatus("Enter your email address");
    return;
  }

  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  setSyncStatus(error ? error.message : "Check your email for the sign-in link");
});

document.getElementById("syncNowBtn").addEventListener("click", syncNow);
document.getElementById("signOutBtn").addEventListener("click", async function() {
  const { error } = await supabaseClient.auth.signOut();
  setSyncStatus(error ? error.message : "Signed out; local data remains on this device");
});

// --- INITIAL LOAD ---
renderHome();
initSupabase();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function(error) {
      console.error("Service worker registration failed:", error);
    });
  });
}
</script>
